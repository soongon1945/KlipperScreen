#
# DO NOT EDIT THIS FILE USE KlipperScreen.conf
#

[menu __print]
name: {{ gettext('Print Control') }}

[menu __print temperature]
name: {{ gettext('Temperature') }}
icon: heat-up
panel: temperature
enable: {{ (printer.temperature_devices.count > 0) or (printer.extruders.count > 0)}}

[menu __print fan]
name: {{ gettext('Fan') }}
icon: fan
panel: fan
enable: {{ printer.fans.count > 0 }}

[menu __print move]
name: {{ gettext('Move') }}
icon: move
panel: move
enable: {{ printer.pause_resume.is_paused }}

[menu __print extrude]
name: {{ gettext('Extrude') }}
icon: extrude
panel: extrude
enable: {{ printer.extruders.count > 0 }}

[menu __print power]
name: {{ gettext('Power') }}
icon: shutdown
panel: power
enable: {{ moonraker.power_devices.count > 0 }}

[menu __print led]
name: {{ gettext('Leds') }}
icon: light
panel: led
enable: {{ printer.leds.count > 0 }}

[menu __print macros]
name: {{ gettext('Macros') }}
icon: custom-script
panel: gcode_macros
# Show only while idle: running a macro mid-print would move the toolhead
# around or change temperatures while the print is in progress.
enable: {{ printer.state != 'printing' and printer.state != 'paused' }}

[menu __print notifications]
name: {{ gettext('Notifications') }}
icon: notifications
panel: notifications

[menu __print camera]
name: {{ gettext('Camera') }}
icon: camera
panel: camera
enable: False

[menu __print console]
name: {{ gettext('Console') }}
icon: console
panel: console

[menu __print limits]
name: {{ gettext('Limits') }}
icon: fine-tune
panel: limits

[menu __print network]
name: {{ gettext('Network') }}
icon: network
panel: network
# Hide network settings during printing; still available from the main menu.
enable: False

[menu __print settings]
name: KlipperScreen
icon: settings
panel: settings

[menu __print spoolman]
name: Spoolman
icon: spoolman
panel: spoolman
enable: {{ moonraker.spoolman }}

[menu __print system]
name: {{ gettext('System') }}
icon: info
panel: system
# Hide system info during printing; still available from the main menu.
enable: False

[menu __print pins]
name: {{ gettext('Pins') }}
icon: hashtag
panel: pins
enable: False

[menu __print lock]
name: {{ gettext('Lock') }}
icon: lock
panel: lock_screen
enable: False
